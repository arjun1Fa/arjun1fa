name: Update GitHub activity card

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM="$(date -u -d '1 year ago' +%Y-%m-%dT%H:%M:%SZ)"
          TO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh api graphql \
            -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' \
            -F login='arjun1Fa' \
            -F from="$FROM" \
            -F to="$TO" > /tmp/calendar.json

          test "$(jq -r '.data.user.login // "arjun1Fa"' /tmp/calendar.json)" != "null"

      - name: Calculate streaks
        run: |
          python3 - <<'PY'
          import json
          from datetime import date, timedelta

          payload = json.load(open("/tmp/calendar.json", "r", encoding="utf-8"))
          calendar = payload["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          days = {}
          for week in calendar["weeks"]:
              for item in week["contributionDays"]:
                  days[date.fromisoformat(item["date"])] = int(item["contributionCount"])

          ordered = sorted(days)
          active = [d for d in ordered if days[d] > 0]

          current = 0
          if active:
              anchor = active[-1]
              cursor = anchor
              while days.get(cursor, 0) > 0:
                  current += 1
                  cursor -= timedelta(days=1)

          longest = 0
          running = 0
          previous = None
          for d in active:
              if previous is not None and d == previous + timedelta(days=1):
                  running += 1
              else:
                  running = 1
              longest = max(longest, running)
              previous = d

          with open("/tmp/activity.env", "w", encoding="utf-8") as f:
              f.write(f"TOTAL={int(calendar['totalContributions'])}\n")
              f.write(f"CURRENT={current}\n")
              f.write(f"LONGEST={longest}\n")
          PY

          cat /tmp/activity.env

      - name: Render GitHub activity card
        run: |
          set -a
          . /tmp/activity.env
          set +a

          python3 - <<'PY'
          from pathlib import Path
          import os

          total = f"{int(os.environ['TOTAL']):,}"
          current = os.environ["CURRENT"]
          longest = os.environ["LONGEST"]

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220">
          <rect width="1100" height="220" rx="14" fill="#0D100F"/>
          <text x="550" y="48" text-anchor="middle" fill="#7F8A83" font-family="monospace" font-size="11" letter-spacing="2">GITHUB / LAST YEAR</text>

          <g transform="translate(38 72)">
            <rect width="320" height="112" rx="11" fill="#131815" stroke="#2A312C"/>
            <text x="28" y="33" fill="#A3B18A" font-family="monospace" font-size="10">01</text>
            <text x="28" y="70" fill="#F1F3F0" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">{total}</text>
            <text x="28" y="94" fill="#858F89" font-family="Arial, Helvetica, sans-serif" font-size="13">Total contributions</text>
          </g>

          <g transform="translate(390 72)">
            <rect width="320" height="112" rx="11" fill="#131815" stroke="#2A312C"/>
            <text x="28" y="33" fill="#A3B18A" font-family="monospace" font-size="10">02</text>
            <text x="28" y="70" fill="#F1F3F0" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">{current}</text>
            <text x="28" y="94" fill="#858F89" font-family="Arial, Helvetica, sans-serif" font-size="13">Current streak · days</text>
          </g>

          <g transform="translate(742 72)">
            <rect width="320" height="112" rx="11" fill="#131815" stroke="#2A312C"/>
            <text x="28" y="33" fill="#A3B18A" font-family="monospace" font-size="10">03</text>
            <text x="28" y="70" fill="#F1F3F0" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">{longest}</text>
            <text x="28" y="94" fill="#858F89" font-family="Arial, Helvetica, sans-serif" font-size="13">Longest streak · days</text>
          </g>
          </svg>"""

          Path("assets/contribution-count.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-count.svg

          if git diff --cached --quiet; then
            echo "GitHub activity card unchanged."
            exit 0
          fi

          git commit -m "chore: update GitHub activity card"
          git push
