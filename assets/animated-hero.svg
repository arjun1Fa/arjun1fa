<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050507"/>
    <stop offset="0.5" stop-color="#0D0D12"/>
    <stop offset="1" stop-color="#160B14"/>
  </linearGradient>
  <linearGradient id="accent" x1="70" y1="0" x2="1130" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#06B6D4"/>
    <stop offset="1" stop-color="#F43F5E"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>

<ellipse cx="190" cy="80" rx="180" ry="90" fill="#7C3AED" fill-opacity="0.09" filter="url(#glow)">
  <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="1040" cy="285" rx="230" ry="110" fill="#06B6D4" fill-opacity="0.08" filter="url(#glow)">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
</ellipse>

<path d="M0 278 C220 220 350 330 560 260 C760 194 900 100 1200 152" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7">
  <animate attributeName="d" dur="6s" repeatCount="indefinite"
    values="M0 278 C220 220 350 330 560 260 C760 194 900 100 1200 152;
            M0 250 C220 310 370 190 560 280 C740 350 980 80 1200 190;
            M0 278 C220 220 350 330 560 260 C760 194 900 100 1200 152"/>
</path>

<g opacity="0.9">
  <circle cx="92" cy="74" r="3" fill="#FFFFFF"><animate attributeName="r" values="2;5;2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1094" cy="82" r="2.5" fill="#FFFFFF"><animate attributeName="r" values="2;4;2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="205" r="3" fill="#FFFFFF"><animate attributeName="r" values="2;5;2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="238" cy="250" r="2.5" fill="#FFFFFF"><animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/></circle>
</g>

<text x="70" y="78" fill="#A1A1AA" font-family="monospace" font-size="15" letter-spacing="3">SYSTEM / PROFILE / ARJUN</text>

<text x="70" y="160" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">
  ARJUN A S
  <animate attributeName="opacity" values="0.94;1;0.94" dur="3.2s" repeatCount="indefinite"/>
</text>

<text x="74" y="205" fill="#D4D4D8" font-family="monospace" font-size="20">
  building useful things with AI + code
</text>

<text x="74" y="247" fill="url(#accent)" font-family="monospace" font-size="17" font-weight="700">
  AI/ML  •  COMPUTER VISION  •  FULL-STACK  •  SYSTEMS
</text>

<g transform="translate(74,286)">
  <rect x="0" y="0" width="260" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <circle cx="20" cy="19" r="5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="36" y="25" fill="#E4E4E7" font-family="monospace" font-size="14">currently shipping ideas</text>
</g>

<text x="1110" y="325" fill="#71717A" font-family="monospace" font-size="12" text-anchor="end">v2.0</text>
</svg>