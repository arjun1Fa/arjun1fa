<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="174" viewBox="0 0 1200 174" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">Understand the problem, design the approach, build and iterate, test for reliability, ship to users, and learn from feedback.</desc>
  <rect width="1200" height="174" fill="#0D0F12"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(8 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">01</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Understand</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Find the real</text><text x="92" y="122" fill="#CDD2D9" font-size="15">problem first.</text>
    </g>
    <g transform="translate(208 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">02</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Design</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Break it down.</text><text x="92" y="122" fill="#CDD2D9" font-size="15">Choose trade-offs.</text>
    </g>
    <g transform="translate(408 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">03</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Build</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Implement the core.</text><text x="92" y="122" fill="#CDD2D9" font-size="15">Iterate quickly.</text>
    </g>
    <g transform="translate(608 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">04</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Test</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Measure, check,</text><text x="92" y="122" fill="#CDD2D9" font-size="15">and make it reliable.</text>
    </g>
    <g transform="translate(808 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">05</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Ship</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Deploy and get</text><text x="92" y="122" fill="#CDD2D9" font-size="15">it to real users.</text>
    </g>
    <g transform="translate(1008 8)">
      <rect width="184" height="156" fill="#13171D" stroke="#343940"/>
      <rect width="184" height="4" fill="#F02D3A"/>
      <text x="22" y="34" fill="#F02D3A" font-family="monospace" font-size="13" text-anchor="start">06</text>
      <text x="92" y="69" fill="#F0F3F7" font-size="21" font-weight="700">Learn</text>
      <text x="92" y="101" fill="#CDD2D9" font-size="15">Use feedback to</text><text x="92" y="122" fill="#CDD2D9" font-size="15">improve the next version.</text>
    </g>
  </g>
</svg>