  <title id="title">Let's build together</title>
  <desc id="desc">Arjun is open to collaboration on AI, computer vision, full-stack development, and systems engineering.</desc>
  <rect width="1200" height="170" fill="#0D0F12"/>
  <rect x="1" y="1" width="1198" height="168" fill="none" stroke="#343940"/>
  <rect x="1" y="1" width="7" height="168" fill="#F01832"/>
  <rect x="35" y="31" width="4" height="30" fill="#F01832"/>
  <text x="55" y="43" fill="#FF4357" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">OPEN TO COLLABORATION</text>
  <text x="35" y="93" fill="#F3F5F8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Have a problem worth solving?</text>
  <text x="37" y="127" fill="#C3CAD3" font-family="Arial, Helvetica, sans-serif" font-size="18">Let's build something useful together.</text>
