<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop stop-color="#07090f"/><stop offset=".55" stop-color="#0d1220"/><stop offset="1" stop-color="#12091b"/>
  </linearGradient>
  <linearGradient id="line" x1="80" y1="0" x2="1120" y2="0">
    <stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="300" rx="26" fill="url(#bg)"/>
<rect width="1200" height="300" rx="26" fill="url(#grid)"/>

<circle cx="1040" cy="40" r="110" fill="#7c3aed" fill-opacity=".09" filter="url(#glow)">
  <animate attributeName="opacity" values=".35;.7;.35" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="180" cy="270" r="120" fill="#06b6d4" fill-opacity=".06" filter="url(#glow)">
  <animate attributeName="opacity" values=".25;.55;.25" dur="5s" repeatCount="indefinite"/>
</circle>

<text x="48" y="54" fill="#71717a" font-family="monospace" font-size="13" letter-spacing="3">GITHUB / ACTIVITY SIGNAL</text>
<text x="48" y="92" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Code. Build. Ship.</text>
<text x="48" y="120" fill="#9ca3af" font-family="Arial" font-size="15">A quiet little dashboard of the work happening in the background.</text>

<g transform="translate(48 158)">
  <rect width="240" height="88" rx="18" fill="#0a0d15" stroke="#8b5cf6" stroke-opacity=".55"/>
  <text x="20" y="29" fill="#a78bfa" font-family="monospace" font-size="12">01 / RHYTHM</text>
  <text x="20" y="57" fill="#f5f3ff" font-family="Arial" font-size="20" font-weight="700">Consistency</text>
  <circle cx="204" cy="43" r="18" fill="#8b5cf6" fill-opacity=".12" stroke="#a78bfa"/>
  <path d="M196 43h16M204 35v16" stroke="#ddd6fe" stroke-width="2"/>
</g>

<g transform="translate(308 158)">
  <rect width="240" height="88" rx="18" fill="#0a0d15" stroke="#22d3ee" stroke-opacity=".55"/>
  <text x="20" y="29" fill="#67e8f9" font-family="monospace" font-size="12">02 / STACK</text>
  <text x="20" y="57" fill="#ecfeff" font-family="Arial" font-size="20" font-weight="700">Code Mix</text>
  <circle cx="204" cy="43" r="18" fill="#22d3ee" fill-opacity=".10" stroke="#67e8f9"/>
  <path d="M195 47l7-8 7 5 6-9" fill="none" stroke="#cffafe" stroke-width="2"/>
</g>

<g transform="translate(568 158)">
  <rect width="240" height="88" rx="18" fill="#0a0d15" stroke="#f472b6" stroke-opacity=".55"/>
  <text x="20" y="29" fill="#f9a8d4" font-family="monospace" font-size="12">03 / FLOW</text>
  <text x="20" y="57" fill="#fdf2f8" font-family="Arial" font-size="20" font-weight="700">Contribution</text>
  <circle cx="204" cy="43" r="18" fill="#f472b6" fill-opacity=".10" stroke="#f9a8d4"/>
  <path d="M196 49l7-7 5 4 7-12" fill="none" stroke="#fbcfe8" stroke-width="2"/>
</g>

<g transform="translate(828 158)">
  <rect width="324" height="88" rx="18" fill="#0a0d15" stroke="#475569" stroke-opacity=".65"/>
  <text x="20" y="29" fill="#94a3b8" font-family="monospace" font-size="12">04 / SIGNAL</text>
  <text x="20" y="57" fill="#f8fafc" font-family="Arial" font-size="20" font-weight="700">Always iterating</text>
  <circle cx="279" cy="44" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M244 69h42" stroke="#22c55e" stroke-width="2"/>
</g>

<path d="M48 270 C170 226 260 278 382 246 C500 214 584 268 702 226 C826 182 914 236 1152 190"
      fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round">
  <animate attributeName="d" dur="7s" repeatCount="indefinite"
    values="M48 270 C170 226 260 278 382 246 C500 214 584 268 702 226 C826 182 914 236 1152 190;
            M48 252 C160 286 260 216 382 258 C500 294 606 204 702 244 C814 284 940 178 1152 214;
            M48 270 C170 226 260 278 382 246 C500 214 584 268 702 226 C826 182 914 236 1152 190"/>
</path>
</svg>