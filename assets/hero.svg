<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#070708"/>
      <stop offset=".52" stop-color="#14080B"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="s" x1="0" x2="1">
      <stop offset="0" stop-color="#777980"/>
      <stop offset=".5" stop-color="#F1F1F3"/>
      <stop offset="1" stop-color="#8A8C93"/>
    </linearGradient>
    <radialGradient id="r">
      <stop offset="0" stop-color="#B8202A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#B8202A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="600" fill="url(#b)"/>
  <ellipse cx="800" cy="290" rx="470" ry="280" fill="url(#r)" filter="url(#blur)"/>
  <rect x="24" y="24" width="1552" height="552" rx="15" fill="none" stroke="#B8202A" stroke-width="2"/>
  <rect x="42" y="42" width="1516" height="516" rx="12" fill="none" stroke="#494A51" stroke-width="1"/>

  <!-- city-like red window accents -->
  <g opacity=".35" fill="#B8202A">
    <rect x="80" y="365" width="9" height="70"/><rect x="96" y="394" width="9" height="41"/>
    <rect x="137" y="340" width="9" height="95"/><rect x="153" y="380" width="9" height="55"/>
    <rect x="1430" y="355" width="9" height="80"/><rect x="1446" y="382" width="9" height="53"/>
    <rect x="1490" y="338" width="9" height="97"/><rect x="1506" y="395" width="9" height="40"/>
  </g>

  <!-- original armored T-pose figure -->
  <g transform="translate(800 55)">
    <circle cx="0" cy="260" r="196" fill="none" stroke="#B8202A" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="0" cy="260" r="158" fill="none" stroke="#999BA2" stroke-opacity=".10" stroke-width="1"/>

    <!-- helmet -->
    <path d="M-45 126 L-33 85 L0 65 L33 85 L45 126 L30 157 L0 169 L-30 157 Z"
          fill="#101114" stroke="url(#s)" stroke-width="5"/>
    <path d="M-28 119 H28" stroke="#B8202A" stroke-width="5"/>
    <path d="M-14 107 L0 94 L14 107" fill="none" stroke="#D7D7DB" stroke-width="2"/>

    <!-- torso -->
    <path d="M-115 168 L-57 146 L0 161 L57 146 L115 168 L92 300 L45 321 L0 310 L-45 321 L-92 300 Z"
          fill="#0D0E10" stroke="url(#s)" stroke-width="6"/>
    <path d="M-29 171 L0 196 L29 171 L22 289 L0 308 L-22 289 Z"
          fill="#18191D" stroke="#B8202A" stroke-width="4"/>
    <circle cx="0" cy="224" r="11" fill="none" stroke="#ECECEF" stroke-width="3"/>
    <circle cx="0" cy="224" r="4" fill="#B8202A"/>

    <!-- left arm -->
    <path d="M-105 174 L-175 159 L-295 194 L-465 194" fill="none" stroke="#0D0E10" stroke-width="50" stroke-linecap="round"/>
    <path d="M-105 174 L-175 159 L-295 194 L-465 194" fill="none" stroke="url(#s)" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <rect x="-510" y="168" width="70" height="53" rx="14" fill="#101114" stroke="#B8202A" stroke-width="5"/>

    <!-- right arm -->
    <path d="M105 174 L175 159 L295 194 L465 194" fill="none" stroke="#0D0E10" stroke-width="50" stroke-linecap="round"/>
    <path d="M105 174 L175 159 L295 194 L465 194" fill="none" stroke="url(#s)" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <rect x="440" y="168" width="70" height="53" rx="14" fill="#101114" stroke="#B8202A" stroke-width="5"/>

    <!-- legs -->
    <path d="M-44 300 L-35 398 L-85 518 L-29 518 L0 414 L29 518 L85 518 L35 398 L44 300 Z"
          fill="#0D0E10" stroke="url(#s)" stroke-width="6"/>
    <path d="M-88 518 H-20 M20 518 H88" stroke="#B8202A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- left identity -->
  <text x="86" y="105" font-family="Georgia, Times New Roman, serif" font-size="17" letter-spacing="5" fill="#B8202A">PRIVATE BUILD ROOM / 01</text>
  <text x="86" y="140" font-family="Georgia, Times New Roman, serif" font-size="13" letter-spacing="4" fill="#A7A8AE">AI • SOFTWARE • SYSTEMS</text>

  <!-- right identity -->
  <text x="1514" y="105" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="17" letter-spacing="5" fill="#B8202A">ARJUN A S</text>
  <text x="1514" y="140" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="13" letter-spacing="4" fill="#A7A8AE">BUILD / BREAK / FIX / SHIP</text>

  <!-- footer plaque -->
  <rect x="575" y="532" width="450" height="32" rx="16" fill="#0B0C0E" stroke="#3F4047"/>
  <text x="800" y="554" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="12" letter-spacing="4" fill="#D4D5D9">GOOD IDEAS DESERVE GOOD EXECUTION</text>
</svg>