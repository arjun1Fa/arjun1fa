<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#070709"/>
    <stop offset=".5" stop-color="#12090B"/>
    <stop offset="1" stop-color="#070709"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" x2="1">
    <stop offset="0" stop-color="#7B7D84"/>
    <stop offset=".5" stop-color="#F2F2F4"/>
    <stop offset="1" stop-color="#8D8F96"/>
  </linearGradient>
  <radialGradient id="spot">
    <stop offset="0" stop-color="#B8202A" stop-opacity=".30"/>
    <stop offset="1" stop-color="#B8202A" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="640" fill="url(#bg)"/>
<ellipse cx="800" cy="320" rx="500" ry="310" fill="url(#spot)"/>

<!-- outer frame -->
<rect x="24" y="24" width="1552" height="592" rx="14" fill="none" stroke="#B8202A" stroke-width="2"/>
<rect x="42" y="42" width="1516" height="556" rx="10" fill="none" stroke="#4B4D54" stroke-width="1"/>

<!-- art deco lines -->
<path d="M70 110 H1530" stroke="#303137"/>
<path d="M70 514 H1530" stroke="#303137"/>
<path d="M70 110 H390" stroke="#B8202A" stroke-width="3"/>
<path d="M1210 514 H1530" stroke="#B8202A" stroke-width="3"/>

<!-- left label -->
<text x="82" y="91" font-family="Georgia,serif" font-size="15" letter-spacing="5" fill="#B8202A">ARJUN A S / 01</text>
<text x="82" y="128" font-family="Georgia,serif" font-size="12" letter-spacing="4" fill="#9EA0A8">AI • SOFTWARE • SYSTEMS</text>

<!-- right label -->
<text x="1518" y="91" text-anchor="end" font-family="Georgia,serif" font-size="15" letter-spacing="5" fill="#B8202A">BUILT TO LAST</text>
<text x="1518" y="128" text-anchor="end" font-family="Georgia,serif" font-size="12" letter-spacing="4" fill="#9EA0A8">BLACK / RED / SILVER</text>

<!-- elephant crest -->
<g transform="translate(175 182)" fill="none">
  <path d="M94 28 C52 18 20 42 16 77 C13 108 28 126 52 128 C43 151 56 168 78 163 C99 158 102 134 100 110 C129 100 142 69 126 45 C118 34 107 29 94 28Z"
        stroke="url(#silver)" stroke-width="5"/>
  <path d="M97 52 C117 56 122 71 114 85 C106 98 90 101 73 96"
        stroke="#B8202A" stroke-width="4"/>
  <circle cx="70" cy="53" r="3.5" fill="#ECECEF" stroke="none"/>
  <path d="M27 77 C4 59 7 38 27 27" stroke="#B8202A" stroke-width="5"/>
  <path d="M52 126 L48 160 M94 120 L98 160" stroke="#9EA0A8" stroke-width="4"/>
  <path d="M45 160 H30 M100 160 H115" stroke="#9EA0A8" stroke-width="4"/>
</g>

<!-- T-pose armored silhouette -->
<g transform="translate(1010 84)">
  <!-- head -->
  <path d="M-43 108 L-32 70 L0 52 L32 70 L43 108 L29 137 L0 150 L-29 137 Z"
        fill="#0D0E11" stroke="url(#silver)" stroke-width="5"/>
  <path d="M-25 102 H25" stroke="#B8202A" stroke-width="5"/>

  <!-- body -->
  <path d="M-112 150 L-52 132 L0 146 L52 132 L112 150 L90 292 L44 313 L0 301 L-44 313 L-90 292 Z"
        fill="#0D0E11" stroke="url(#silver)" stroke-width="6"/>
  <path d="M-27 155 L0 180 L27 155 L21 280 L0 299 L-21 280 Z"
        fill="#17181B" stroke="#B8202A" stroke-width="4"/>

  <!-- chest emblem -->
  <path d="M0 207 L15 222 L8 243 L0 251 L-8 243 L-15 222 Z"
        fill="#B8202A"/>
  <circle cx="0" cy="226" r="4" fill="#F2F2F4"/>

  <!-- left arm -->
  <path d="M-104 157 L-175 143 L-292 181 L-490 181"
        fill="none" stroke="#0D0E11" stroke-width="48" stroke-linecap="round"/>
  <path d="M-104 157 L-175 143 L-292 181 L-490 181"
        fill="none" stroke="#92949B" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
  <rect x="-530" y="155" width="70" height="53" rx="14" fill="#101114" stroke="#B8202A" stroke-width="5"/>

  <!-- right arm -->
  <path d="M104 157 L175 143 L292 181 L490 181"
        fill="none" stroke="#0D0E11" stroke-width="48" stroke-linecap="round"/>
  <path d="M104 157 L175 143 L292 181 L490 181"
        fill="none" stroke="#92949B" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
  <rect x="460" y="155" width="70" height="53" rx="14" fill="#101114" stroke="#B8202A" stroke-width="5"/>

  <!-- legs -->
  <path d="M-43 293 L-34 387 L-84 508 L-28 508 L0 405 L28 508 L84 508 L34 387 L43 293 Z"
        fill="#0D0E11" stroke="url(#silver)" stroke-width="6"/>
  <path d="M-85 510 H-22 M22 510 H85" stroke="#B8202A" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- centre title -->
<text x="800" y="535" text-anchor="middle"
      font-family="Georgia,serif" font-size="18" letter-spacing="8" fill="#B8202A">
  BUILD • BREAK • FIX • SHIP
</text>

<text x="800" y="571" text-anchor="middle"
      font-family="Georgia,serif" font-size="12" letter-spacing="4" fill="#B9BAC1">
  GOOD IDEAS DESERVE GOOD EXECUTION
</text>
</svg>