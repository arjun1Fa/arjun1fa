<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Focus areas</title>
  <desc id="desc">AI and agents, computer vision, full-stack applications, and distributed systems.</desc>
  <rect width="1200" height="380" fill="#0D0F12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(28 22)">
      <rect width="560" height="154" fill="#13171D" stroke="#343940"/>
      <rect width="5" height="154" fill="#F02D3A"/>
      <text x="26" y="34" fill="#F02D3A" font-family="monospace" font-size="13" font-weight="700">01 / AI &amp; AGENTS</text>
      <text x="26" y="70" fill="#F0F3F7" font-size="25" font-weight="700">AI that does useful work</text>
      <text x="26" y="101" fill="#CDD2D9" font-size="17">LLM applications, local inference, and tool-using</text>
      <text x="26" y="125" fill="#CDD2D9" font-size="17">workflows that connect models with real tasks.</text>
    </g>
    <g transform="translate(612 22)">
      <rect width="560" height="154" fill="#13171D" stroke="#343940"/>
      <rect width="5" height="154" fill="#F02D3A"/>
      <text x="26" y="34" fill="#F02D3A" font-family="monospace" font-size="13" font-weight="700">02 / COMPUTER VISION</text>
      <text x="26" y="70" fill="#F0F3F7" font-size="25" font-weight="700">Models for the real world</text>
      <text x="26" y="101" fill="#CDD2D9" font-size="17">Detection, image understanding, and practical</text>
      <text x="26" y="125" fill="#CDD2D9" font-size="17">computer-vision pipelines.</text>
    </g>
    <g transform="translate(28 200)">
      <rect width="560" height="154" fill="#13171D" stroke="#343940"/>
      <rect width="5" height="154" fill="#F02D3A"/>
      <text x="26" y="34" fill="#F02D3A" font-family="monospace" font-size="13" font-weight="700">03 / FULL-STACK DEVELOPMENT</text>
      <text x="26" y="70" fill="#F0F3F7" font-size="25" font-weight="700">From interface to API</text>
      <text x="26" y="101" fill="#CDD2D9" font-size="17">Web and mobile apps, Python backends, and</text>
      <text x="26" y="125" fill="#CDD2D9" font-size="17">services designed around real user needs.</text>
    </g>
    <g transform="translate(612 200)">
      <rect width="560" height="154" fill="#13171D" stroke="#343940"/>
      <rect width="5" height="154" fill="#F02D3A"/>
      <text x="26" y="34" fill="#F02D3A" font-family="monospace" font-size="13" font-weight="700">04 / DISTRIBUTED SYSTEMS</text>
      <text x="26" y="70" fill="#F0F3F7" font-size="25" font-weight="700">Make systems work together</text>
      <text x="26" y="101" fill="#CDD2D9" font-size="17">Inference scheduling, queues, workload distribution,</text>
      <text x="26" y="125" fill="#CDD2D9" font-size="17">and coordination across multiple nodes.</text>
    </g>
  </g>
</svg>