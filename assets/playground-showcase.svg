<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">What Arjun builds</title>
  <desc id="desc">Four focus areas: AI and agents, computer vision, full-stack products, and distributed systems.</desc>
  <rect width="1200" height="390" rx="22" fill="#0D100F"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(28 24)">
      <rect width="560" height="158" rx="15" fill="#131A15" stroke="#304134"/>
      <rect x="22" y="22" width="5" height="112" rx="2.5" fill="#B9D7A1"/>
      <text x="45" y="43" fill="#A9C49E" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">01 / AI &amp; AGENTS</text>
      <text x="45" y="78" fill="#F2F5F0" font-size="25" font-weight="700">AI that does useful work</text>
      <text x="45" y="106" fill="#C3CEC4" font-size="17">LLM apps, local inference, and tool-using workflows.</text>
      <text x="45" y="134" fill="#91A697" font-family="monospace" font-size="13">LLM APPS  ·  LOCAL AI  ·  MCP</text>
    </g>
    <g transform="translate(612 24)">
      <rect width="560" height="158" rx="15" fill="#131A15" stroke="#304134"/>
      <rect x="22" y="22" width="5" height="112" rx="2.5" fill="#B9D7A1"/>
      <text x="45" y="43" fill="#A9C49E" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">02 / COMPUTER VISION</text>
      <text x="45" y="78" fill="#F2F5F0" font-size="25" font-weight="700">Models for the real world</text>
      <text x="45" y="106" fill="#C3CEC4" font-size="17">Detection and image understanding for practical apps.</text>
      <text x="45" y="134" fill="#91A697" font-family="monospace" font-size="13">YOLO  ·  OPENCV  ·  PYTORCH</text>
    </g>
    <g transform="translate(28 204)">
      <rect width="560" height="158" rx="15" fill="#131A15" stroke="#304134"/>
      <rect x="22" y="22" width="5" height="112" rx="2.5" fill="#B9D7A1"/>
      <text x="45" y="43" fill="#A9C49E" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">03 / FULL-STACK PRODUCTS</text>
      <text x="45" y="78" fill="#F2F5F0" font-size="25" font-weight="700">From interface to API</text>
      <text x="45" y="106" fill="#C3CEC4" font-size="17">Web and mobile apps, backend services, and workflows.</text>
      <text x="45" y="134" fill="#91A697" font-family="monospace" font-size="13">REACT  ·  NODE.JS  ·  FLUTTER</text>
    </g>
    <g transform="translate(612 204)">
      <rect width="560" height="158" rx="15" fill="#131A15" stroke="#304134"/>
      <rect x="22" y="22" width="5" height="112" rx="2.5" fill="#B9D7A1"/>
      <text x="45" y="43" fill="#A9C49E" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">04 / DISTRIBUTED SYSTEMS</text>
      <text x="45" y="78" fill="#F2F5F0" font-size="25" font-weight="700">Make devices work together</text>
      <text x="45" y="106" fill="#C3CEC4" font-size="17">Inference scheduling, queues, and workload distribution.</text>
      <text x="45" y="134" fill="#91A697" font-family="monospace" font-size="13">TASKMESH  ·  SCHEDULING  ·  SYSTEMS</text>
    </g>
  </g>
</svg>