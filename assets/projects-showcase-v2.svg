      <text x="24" y="109" fill="#CDD2D9" font-size="17">A workload-splitting system for video inference,</text>
      <text x="24" y="134" fill="#CDD2D9" font-size="17">exploring scheduling across distributed nodes.</text>
      <rect x="24" y="159" width="120" height="30" fill="#271519" stroke="#773039"/><text x="84" y="179" fill="#F0F3F7" font-size="14" text-anchor="middle">Scheduling</text>
      <rect x="154" y="159" width="145" height="30" fill="#1A2027" stroke="#343940"/><text x="226" y="179" fill="#F0F3F7" font-size="14" text-anchor="middle">AI inference</text>
