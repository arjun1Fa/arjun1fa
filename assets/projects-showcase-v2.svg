<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Selected projects</title>
  <desc id="desc">TaskMesh distributed inference, Smartilee commerce AI, NutriVision computer vision, and CET CCET GPU inference fair scheduling.</desc>
