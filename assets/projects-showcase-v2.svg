      <rect x="24" y="159" width="120" height="30" fill="#271519" stroke="#773039"/><text x="84" y="179" fill="#F0F3F7" font-size="14" text-anchor="middle">LLM apps</text>
      <rect x="154" y="159" width="142" height="30" fill="#1A2027" stroke="#343940"/><text x="225" y="179" fill="#F0F3F7" font-size="14" text-anchor="middle">Automation</text>
    </g>
    <g transform="translate(28 306)">
      <rect width="560" height="210" fill="#13171D" stroke="#343940"/>
