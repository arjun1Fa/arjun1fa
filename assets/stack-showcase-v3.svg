<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Technology Toolkit</title>
  <desc id="desc">A high-contrast red and charcoal technology toolkit. Languages, AI and machine learning, applications and backend, data and storage, and developer workflow tools are shown as readable white text on solid red rectangular labels.</desc>
  <rect width="1200" height="560" fill="#0B0E12"/>
  <rect x="8" y="8" width="1184" height="544" fill="none" stroke="#303740" stroke-width="1"/>
  <rect x="28" y="27" width="18" height="18" fill="#F01832"/>
  <text x="62" y="44" fill="#F3F5F8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="1.1">TECHNOLOGY TOOLKIT</text>
  <text x="1150" y="42" fill="#C1C7D0" font-family="monospace" font-size="12" text-anchor="end">TOOLS I WORK WITH</text>
  <line x1="28" y1="63" x2="1172" y2="63" stroke="#343940"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Languages -->
    <g>
      <rect x="28" y="80" width="560" height="157" fill="#101419" stroke="#4B252E"/>
      <rect x="28" y="99" width="5" height="40" fill="#F01832"/>
      <text x="48" y="109" fill="#FF4357" font-size="16" font-weight="800">LANGUAGES</text>
      <g font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
        <rect x="48" y="123" width="116" height="34" fill="#E81731"/><text x="106" y="145">Python</text>
        <rect x="174" y="123" width="136" height="34" fill="#E81731"/><text x="242" y="145">TypeScript</text>
        <rect x="320" y="123" width="135" height="34" fill="#E81731"/><text x="387.5" y="145">JavaScript</text>
        <rect x="48" y="167" width="54" height="34" fill="#E81731"/><text x="75" y="189">C</text>
        <rect x="112" y="167" width="88" height="34" fill="#E81731"/><text x="156" y="189">Dart</text>
        <rect x="210" y="167" width="86" height="34" fill="#E81731"/><text x="253" y="189">Java</text>
      </g>
    </g>

    <!-- AI / ML -->
    <g>
      <rect x="612" y="80" width="560" height="157" fill="#101419" stroke="#4B252E"/>
      <rect x="612" y="99" width="5" height="40" fill="#F01832"/>
      <text x="632" y="109" fill="#FF4357" font-size="16" font-weight="800">AI / MACHINE LEARNING</text>
      <g font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
        <rect x="632" y="123" width="115" height="34" fill="#E81731"/><text x="689.5" y="145">PyTorch</text>
        <rect x="757" y="123" width="138" height="34" fill="#E81731"/><text x="826" y="145">TensorFlow</text>
        <rect x="905" y="123" width="84" height="34" fill="#E81731"/><text x="947" y="145">YOLO</text>
        <rect x="999" y="123" width="105" height="34" fill="#E81731"/><text x="1051.5" y="145">OpenCV</text>
        <rect x="632" y="167" width="140" height="34" fill="#E81731"/><text x="702" y="189">scikit-learn</text>
        <rect x="782" y="167" width="86" height="34" fill="#E81731"/><text x="825" y="189">LLMs</text>
      </g>
    </g>

    <!-- Applications and backend -->
    <g>
      <rect x="28" y="254" width="560" height="157" fill="#101419" stroke="#4B252E"/>
      <rect x="28" y="273" width="5" height="40" fill="#F01832"/>
      <text x="48" y="283" fill="#FF4357" font-size="16" font-weight="800">APPLICATIONS &amp; BACKEND</text>
      <g font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
        <rect x="48" y="297" width="103" height="34" fill="#E81731"/><text x="99.5" y="319">FastAPI</text>
        <rect x="161" y="297" width="82" height="34" fill="#E81731"/><text x="202" y="319">Flask</text>
        <rect x="253" y="297" width="78" height="34" fill="#E81731"/><text x="292" y="319">React</text>
        <rect x="341" y="297" width="103" height="34" fill="#E81731"/><text x="392.5" y="319">Next.js</text>
        <rect x="48" y="341" width="106" height="34" fill="#E81731"/><text x="101" y="363">Node.js</text>
        <rect x="164" y="341" width="106" height="34" fill="#E81731"/><text x="217" y="363">Flutter</text>
      </g>
    </g>

    <!-- Data and storage -->
    <g>
      <rect x="612" y="254" width="560" height="157" fill="#101419" stroke="#4B252E"/>
      <rect x="612" y="273" width="5" height="40" fill="#F01832"/>
      <text x="632" y="283" fill="#FF4357" font-size="16" font-weight="800">DATA &amp; STORAGE</text>
      <g font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
        <rect x="632" y="297" width="150" height="34" fill="#E81731"/><text x="707" y="319">PostgreSQL</text>
        <rect x="792" y="297" width="132" height="34" fill="#E81731"/><text x="858" y="319">Supabase</text>
        <rect x="934" y="297" width="95" height="34" fill="#E81731"/><text x="981.5" y="319">SQLite</text>
        <rect x="632" y="341" width="73" height="34" fill="#E81731"/><text x="668.5" y="363">SQL</text>
      </g>
    </g>

    <!-- Developer workflow -->
    <g>
      <rect x="28" y="428" width="1144" height="108" fill="#101419" stroke="#4B252E"/>
      <rect x="28" y="447" width="5" height="40" fill="#F01832"/>
      <text x="48" y="458" fill="#FF4357" font-size="16" font-weight="800">DEVELOPER WORKFLOW &amp; INFRASTRUCTURE</text>
      <g font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
        <rect x="48" y="475" width="88" height="36" fill="#E81731"/><text x="92" y="498">Git</text>
        <rect x="146" y="475" width="122" height="36" fill="#E81731"/><text x="207" y="498">GitHub</text>
        <rect x="278" y="475" width="122" height="36" fill="#E81731"/><text x="339" y="498">Docker</text>
        <rect x="410" y="475" width="180" height="36" fill="#E81731"/><text x="500" y="498">GitHub Actions</text>
        <rect x="600" y="475" width="100" height="36" fill="#E81731"/><text x="650" y="498">Linux</text>
        <rect x="710" y="475" width="148" height="36" fill="#E81731"/><text x="784" y="498">REST APIs</text>
      </g>
